name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check
      run: npx tsc --noEmit
      
    - name: Lint
      run: npm run lint
      
    - name: Self Check
      run: npm run check

    - name: Env Check
      run: npm run env
      env:
        DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        NEXT_PUBLIC_SITE_URL: https://example.com
        GOOGLE_CLIENT_ID: ci
        GOOGLE_CLIENT_SECRET: ci
        NEXTAUTH_SECRET: ci
        ADMIN_EMAILS: ci@example.com

    - name: Audit
      run: npm audit --audit-level=high --omit=dev
